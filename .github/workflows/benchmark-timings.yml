name: Benchmark profile timings (issue #42)

# Manually-triggered benchmark for the action's platform spinup time. Runs the
# platform deploy N times on cold runners, takes the median, and patches a gist
# with the resulting JSON. The README references that gist via a shields.io
# dynamic-JSON badge so the number stays fresh without anyone hand-editing it.
#
# Inputs from the repo's Actions config (already in place; see #42):
#   - secret  BENCHMARK_GIST_TOKEN — classic PAT scoped to `gist`.
#   - variable BENCHMARK_GIST_ID — hex id of the target gist.
# If either is missing the aggregate job fails hard with a clear ::error::.

on:
  workflow_dispatch:
    inputs:
      samples:
        description: "Runs (median taken across these)"
        type: choice
        options: ["3", "5", "7"]
        default: "3"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  matrix-setup:
    runs-on: ubuntu-24.04
    outputs:
      indices: ${{ steps.gen.outputs.indices }}
    steps:
      - id: gen
        run: |
          N=${{ inputs.samples }}
          INDICES="[$(seq -s ',' 1 $N)]"
          echo "indices=$INDICES" >> "$GITHUB_OUTPUT"
          echo "Will run $N samples: $INDICES"

  platform:
    needs: matrix-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJSON(needs.matrix-setup.outputs.indices) }}
    steps:
      - uses: actions/checkout@v6

      - name: Mark start
        id: mark
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      # The action deploys the platform and tears it down in its post step.
      - uses: ./
        id: sandbox
        with:
          cluster-name: bench-platform-${{ matrix.sample }}

      - name: Record sample duration
        run: |
          end=$(date +%s)
          duration=$(( end - ${{ steps.mark.outputs.epoch }} ))
          mkdir -p artifacts
          echo "$duration" > "artifacts/platform-${{ matrix.sample }}.txt"
          echo "platform sample ${{ matrix.sample }}: ${duration}s"

      - uses: actions/upload-artifact@v5
        with:
          name: timing-platform-${{ matrix.sample }}
          path: artifacts/

  aggregate:
    needs: [matrix-setup, platform]
    if: always() && !cancelled() && needs.platform.result != 'failure'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: timing-*
          merge-multiple: true
          path: timings

      - name: Compute median
        id: medians
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( timings/platform-*.txt )
          shopt -u nullglob
          if [ ${#files[@]} -eq 0 ]; then
            echo "platform=null" >> "$GITHUB_OUTPUT"
            echo "no samples"; exit 0
          fi
          values=()
          for f in "${files[@]}"; do values+=( "$(cat "$f")" ); done
          IFS=$'\n' read -r -d '' -a sorted < <(printf '%s\n' "${values[@]}" | sort -n && printf '\0')
          n=${#sorted[@]}
          if (( n % 2 == 1 )); then pl="${sorted[$((n/2))]}"; else pl="${sorted[$((n/2 - 1))]}"; fi
          echo "platform=$pl" >> "$GITHUB_OUTPUT"
          echo "platform median: $pl"

      - name: Build payload
        env:
          PL: ${{ steps.medians.outputs.platform }}
          SAMPLES: ${{ inputs.samples }}
        run: |
          set -euo pipefail
          cat > benchmark.json <<EOF
          {
            "updated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "run_id": "${{ github.run_id }}",
            "commit": "${{ github.sha }}",
            "samples": ${SAMPLES},
            "platform_seconds": ${PL},
            "platform_from_source_seconds": null
          }
          EOF
          echo "--- payload ---"
          cat benchmark.json

      - name: Patch gist
        env:
          GH_TOKEN: ${{ secrets.BENCHMARK_GIST_TOKEN }}
          GIST_ID: ${{ vars.BENCHMARK_GIST_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::BENCHMARK_GIST_TOKEN secret is unset. See the setup block at the top of this workflow."
            exit 1
          fi
          if [[ -z "${GIST_ID}" ]]; then
            echo "::error::BENCHMARK_GIST_ID variable is unset. See the setup block at the top of this workflow."
            exit 1
          fi
          jq -n --rawfile body benchmark.json \
            '{ files: { "benchmark.json": { content: $body } } }' \
            > /tmp/patch.json
          gh api -X PATCH "gists/${GIST_ID}" --input /tmp/patch.json
          echo "Gist patched: https://gist.github.com/${GIST_ID}"

      - name: Summary
        run: |
          {
            echo "### Benchmark results"
            echo ""
            echo "| metric | median (s) | samples |"
            echo "|--------|------------|---------|"
            echo "| platform | ${{ steps.medians.outputs.platform }} | ${{ inputs.samples }} |"
          } >> "$GITHUB_STEP_SUMMARY"
