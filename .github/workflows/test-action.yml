name: Test Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'action.yml'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/test-action.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-cluster-only:
    name: "Test cluster-only profile"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Nebari Sandbox
        id: sandbox
        uses: ./
        with:
          profile: cluster-only
          cluster-name: test-cluster

      - name: Verify cluster is functional
        run: |
          echo "Kubeconfig: ${{ steps.sandbox.outputs.kubeconfig }}"
          echo "Cluster: ${{ steps.sandbox.outputs.cluster-name }}"

          # Verify we can talk to the cluster
          kubectl get namespaces

          # Verify core components are running
          kubectl get pods -n kube-system

          # Deploy a simple workload to confirm scheduling works
          kubectl create deployment nginx --image=nginx:alpine --replicas=1
          kubectl wait --for=condition=Available deployment/nginx --timeout=60s
          kubectl delete deployment nginx

      - name: wait-platform must fail on an empty / unreachable cluster (#71)
        # Negative-path guard for the readiness gate. This bare cluster-only
        # cluster has none of the foundational namespaces, so wait-platform.sh
        # must FAIL rather than pass vacuously on "0 resources ready". Pins the
        # regression that motivated the preflight + per-namespace checks.
        env:
          KUBECONFIG: ${{ steps.sandbox.outputs.kubeconfig }}
          AWAIT_TIMEOUT: "30"
        run: |
          set -euo pipefail
          # Empty cluster: reachable (preflight passes) but no foundational
          # namespaces -> must fail via the per-namespace check. Pin the message
          # so this branch can't pass on some unrelated failure.
          out="$(bash scripts/wait-platform.sh 2>&1)" && rc=0 || rc=$?
          if (( rc == 0 )); then
            echo "::error::wait-platform.sh passed on a cluster with no platform workloads"; echo "${out}"; exit 1
          fi
          grep -q "no deployment/daemonset/statefulset found" <<<"${out}" \
            || { echo "::error::empty-cluster failure was not the per-namespace check:"; echo "${out}"; exit 1; }
          echo "OK: empty cluster failed via the per-namespace check"
          # Unreachable cluster: the preflight must be what catches it. Asserting
          # the preflight message (not just a non-zero exit) means a regressed
          # preflight fails here instead of silently passing via the per-ns path.
          out="$(KUBECONFIG=/dev/null bash scripts/wait-platform.sh 2>&1)" && rc=0 || rc=$?
          if (( rc == 0 )); then
            echo "::error::wait-platform.sh passed with an unreachable cluster"; echo "${out}"; exit 1
          fi
          grep -q "Cannot reach the cluster" <<<"${out}" \
            || { echo "::error::unreachable-cluster failure was not caught by the preflight:"; echo "${out}"; exit 1; }
          echo "OK: unreachable cluster failed via the preflight"

      - name: Cleanup
        if: always()
        run: k3d cluster delete ${{ steps.sandbox.outputs.cluster-name }}

  test-platform:
    name: "Test platform profile (pre-built NIC binary)"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Nebari Sandbox
        id: sandbox
        uses: ./
        with:
          profile: platform
          cluster-name: nebari-platform-test
          resource-summary: "true"

      - name: Run scenarios
        run: bash tests/run-scenarios.sh
        env:
          KUBECONFIG: ${{ steps.sandbox.outputs.kubeconfig }}

      - name: Verify keycloak-issuer-url output (#25)
        # Default action config sets `domain: nebari.local`, so the derived
        # issuer URL must be `https://keycloak.nebari.local`. Asserting the
        # exact value catches accidental changes to NIC's URL formula (or to
        # the action's default domain).
        run: |
          set -euo pipefail
          EXPECTED="https://keycloak.nebari.local"
          ACTUAL="${{ steps.sandbox.outputs.keycloak-issuer-url }}"
          if [[ "${ACTUAL}" != "${EXPECTED}" ]]; then
            echo "::error::keycloak-issuer-url mismatch: got '${ACTUAL}', expected '${EXPECTED}'"
            exit 1
          fi
          echo "OK: keycloak-issuer-url = ${ACTUAL}"

      - name: Verify keycloak-realm-admin-password reachability (#25)
        # The previous version of this step waited on Job/keycloak-realm-setup
        # to complete and then read the secret. That doesn't work: the Job
        # has `argocd.argoproj.io/hook-delete-policy: HookSucceeded`, so
        # ArgoCD deletes it as soon as it succeeds. By the time this step
        # runs, `kubectl wait` errors with NotFound.
        #
        # The actual invariant worth checking: the
        # nebari-realm-admin-credentials secret exists and has a non-empty
        # password. NIC creates it during foundational-services install
        # (BEFORE the realm-setup-job even runs), so it's present from the
        # moment the action returns. The action's extract-outputs.sh polling
        # captures it into the keycloak-realm-admin-password output.
        env:
          KUBECONFIG: ${{ steps.sandbox.outputs.kubeconfig }}
          OUTPUT_VALUE: ${{ steps.sandbox.outputs.keycloak-realm-admin-password }}
        run: |
          set -euo pipefail
          SECRET=$(kubectl -n keycloak get secret nebari-realm-admin-credentials \
            -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || true)
          if [[ -z "${SECRET}" ]]; then
            echo "::error::nebari-realm-admin-credentials secret missing or has empty password — NIC foundational install may have failed"
            exit 1
          fi
          if [[ -z "${OUTPUT_VALUE}" ]]; then
            echo "::error::keycloak-realm-admin-password output is empty even though the underlying secret is populated — extract-outputs.sh polling window may need extending"
            exit 1
          fi
          echo "OK: nebari-realm-admin-credentials secret is populated AND captured into the keycloak-realm-admin-password output"

      - name: Verify remaining platform outputs are populated
        # extract-outputs.sh writes every output unconditionally, so a missing
        # secret or LB IP yields an empty output and a green step. Assert the
        # three that weren't already checked above so a silent-empty output
        # fails the suite. Passed via env (not inline) to avoid quoting issues.
        env:
          GATEWAY_IP: ${{ steps.sandbox.outputs.gateway-ip }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ steps.sandbox.outputs.keycloak-admin-password }}
          ARGOCD_ADMIN_PASSWORD: ${{ steps.sandbox.outputs.argocd-admin-password }}
        run: |
          set -euo pipefail
          [[ "${GATEWAY_IP}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::gateway-ip is empty or not an IPv4 address: '${GATEWAY_IP}'"; exit 1; }
          [[ -n "${KEYCLOAK_ADMIN_PASSWORD}" ]] \
            || { echo "::error::keycloak-admin-password output is empty"; exit 1; }
          [[ -n "${ARGOCD_ADMIN_PASSWORD}" ]] \
            || { echo "::error::argocd-admin-password output is empty"; exit 1; }
          echo "OK: gateway-ip=${GATEWAY_IP}; keycloak-admin-password and argocd-admin-password are populated"

      - name: Debug cluster state
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods -A || true

          echo ""
          echo "=== ArgoCD Applications ==="
          kubectl get applications -n argocd -o wide || true

          echo ""
          echo "=== Recent warning events ==="
          kubectl get events -A --field-selector type=Warning --sort-by='.lastTimestamp' 2>/dev/null | tail -30 || true

      - name: Cleanup
        if: always()
        run: |
          k3d cluster delete ${{ steps.sandbox.outputs.cluster-name }}


  # Benchmark / parallel comparison (draft): deploy the SAME platform via NIC's
  # own local provider (kind), which NIC provisions in-process via the kind Go
  # library - instead of the action's k3d + existing-provider path. Runs the
  # exact same scenario suite so we can compare both provisioning methods
  # (works? how long?) side by side in one workflow run.
  benchmark-nic-local-kind:
    name: "Platform via NIC local provider (kind) [benchmark]"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install nic (latest - same binary the k3d job uses)
        shell: bash
        env:
          NIC_VERSION: latest
          GITHUB_TOKEN: ${{ github.token }}
        run: ${{ github.workspace }}/scripts/install-nic.sh

      - name: Write NIC local (kind) config
        shell: bash
        run: |
          cat > /tmp/nic-local.yaml <<'EOF'
          project_name: nebari-kind-bench
          domain: nebari.local
          certificate:
            type: selfsigned
          cluster:
            local: {}
          EOF
          echo "--- config ---"; cat /tmp/nic-local.yaml

      - name: Deploy platform via NIC local provider (kind)
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          nic deploy -f /tmp/nic-local.yaml --timeout 15m
          dur=$(( $(date +%s) - start ))
          echo "kind-local-deploy-seconds=${dur}" >> "$GITHUB_OUTPUT"
          {
            echo "### NIC local (kind) benchmark"
            echo ""
            echo "\`nic deploy\` (kind create + foundational stack): **${dur}s**"
            echo ""
            echo "Compare against the k3d job's \"Setup Nebari Sandbox\" step duration in this run."
          } >> "$GITHUB_STEP_SUMMARY"
        id: deploy

      - name: Point kubectl at the kind cluster
        shell: bash
        run: kubectl config use-context kind-nebari-kind-bench

      # Mirror the composite action's post-deploy steps so this job does the same
      # functional work as the k3d path - extract-outputs, in-cluster DNS, and CA
      # publish are all needed on kind too (same OIDC/TLS story), so timing them
      # here makes the comparison like-for-like. (wait-platform is skipped: it is
      # redundant with nic deploy's own wait, which the kind path already pays.)
      - name: Extract platform outputs (parity with k3d)
        shell: bash
        run: |
          # NIC's local provider auto-creates the gitops repo at
          # ~/.nic/gitops/<project_name>; extract-outputs reads nic-config.yaml
          # from there for the domain/issuer.
          export GITOPS_DIR="${HOME}/.nic/gitops/nebari-kind-bench"
          "${GITHUB_WORKSPACE}/scripts/extract-outputs.sh"

      - name: Set up in-cluster DNS (parity with k3d)
        shell: bash
        env:
          DOMAIN: nebari.local
        run: ${{ github.workspace }}/scripts/setup-in-cluster-dns.sh

      - name: Publish sandbox CA (parity with k3d)
        shell: bash
        env:
          CLUSTER_NAME: nebari-kind-bench
        run: ${{ github.workspace }}/scripts/publish-ca.sh

      - name: Generate resource summary (parity with resource-summary: true)
        shell: bash
        run: python3 ${{ github.workspace }}/scripts/resource-summary.py

      - name: Run consumer-app scenario (portable subset)
        shell: bash
        # NOTE: not the full run-scenarios.sh. The 00-foundational-apps-tree
        # drift guard is tuned to the k3d/existing-provider app set; the local
        # (kind) provider additionally deploys MetalLB (kind has no built-in LB),
        # so its apps/ set legitimately differs. Run the consumer-app gitops flow
        # (the portable part) + the health smoke check below instead.
        run: bash tests/scenarios/consumer-app-via-gitops.sh

      - name: Smoke-check foundational health
        shell: bash
        run: |
          set -euo pipefail
          n=$(kubectl get applications -n argocd -o name | wc -l)
          if (( n < 5 )); then
            echo "::error::only ${n} ArgoCD Applications found - foundational install looks incomplete"; exit 1
          fi
          health=$(kubectl get applications -n argocd \
            -o jsonpath='{range .items[*]}{.metadata.name}={.status.health.status}{"\n"}{end}')
          broken=$(echo "${health}" | grep -E '=(Missing|Unknown)$' || true)
          if [[ -n "${broken}" ]]; then echo "::error::ArgoCD Applications broken:"; echo "${broken}"; exit 1; fi
          degraded=$(echo "${health}" | grep -E '=Degraded$' || true)
          [[ -n "${degraded}" ]] && echo "::warning::Degraded (not failing): ${degraded}"
          echo "OK: ${n} ArgoCD Applications present, none Missing/Unknown"

      - name: Debug on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl get applications -n argocd -o wide || true
          kubectl get events -A --field-selector type=Warning --sort-by='.lastTimestamp' 2>/dev/null | tail -30 || true

      - name: Cleanup
        if: always()
        run: nic destroy -f /tmp/nic-local.yaml --force || true
