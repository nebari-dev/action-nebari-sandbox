name: Test Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'action.yml'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/test-action.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-platform:
    name: "Test platform (kind/local)"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Default nic-version 'latest' resolves to NIC >= v0.13.0, which provides
      # the local (kind) cluster + local repository providers this action uses.
      - name: Setup Nebari Sandbox
        id: sandbox
        uses: ./
        with:
          cluster-name: nebari-platform-test
          resource-summary: "true"

      - name: Smoke check — foundational Applications are Healthy
        env:
          KUBECONFIG: ${{ steps.sandbox.outputs.kubeconfig }}
        run: |
          set -euo pipefail
          kubectl get applications -n argocd -o wide
          n=$(kubectl get applications -n argocd --no-headers 2>/dev/null | wc -l)
          if (( n < 5 )); then
            echo "::error::expected >= 5 ArgoCD Applications, found ${n}"; exit 1
          fi
          bad=$(kubectl get applications -n argocd \
            -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.health.status}{"\n"}{end}' \
            | awk '$2=="Missing" || $2=="Unknown" {print}')
          if [[ -n "${bad}" ]]; then
            echo "::error::some Applications are Missing/Unknown:"; echo "${bad}"; exit 1
          fi
          echo "OK: ${n} Applications, none Missing/Unknown"

      - name: Verify keycloak-issuer-url output (#25)
        run: |
          set -euo pipefail
          EXPECTED="https://keycloak.nebari.local"
          ACTUAL="${{ steps.sandbox.outputs.keycloak-issuer-url }}"
          if [[ "${ACTUAL}" != "${EXPECTED}" ]]; then
            echo "::error::keycloak-issuer-url mismatch: got '${ACTUAL}', expected '${EXPECTED}'"
            exit 1
          fi
          echo "OK: keycloak-issuer-url = ${ACTUAL}"

      - name: Verify keycloak-realm-admin-password reachability (#25)
        env:
          KUBECONFIG: ${{ steps.sandbox.outputs.kubeconfig }}
          OUTPUT_VALUE: ${{ steps.sandbox.outputs.keycloak-realm-admin-password }}
        run: |
          set -euo pipefail
          SECRET=$(kubectl -n keycloak get secret nebari-realm-admin-credentials \
            -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || true)
          if [[ -z "${SECRET}" ]]; then
            echo "::error::nebari-realm-admin-credentials secret missing or empty — NIC foundational install may have failed"
            exit 1
          fi
          if [[ -z "${OUTPUT_VALUE}" ]]; then
            echo "::error::keycloak-realm-admin-password output is empty even though the secret is populated — extract-outputs.sh polling window may need extending"
            exit 1
          fi
          echo "OK: nebari-realm-admin-credentials populated AND captured into the output"

      - name: Verify remaining platform outputs are populated
        env:
          GATEWAY_IP: ${{ steps.sandbox.outputs.gateway-ip }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ steps.sandbox.outputs.keycloak-admin-password }}
          ARGOCD_ADMIN_PASSWORD: ${{ steps.sandbox.outputs.argocd-admin-password }}
        run: |
          set -euo pipefail
          [[ "${GATEWAY_IP}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::gateway-ip is empty or not an IPv4 address: '${GATEWAY_IP}'"; exit 1; }
          [[ -n "${KEYCLOAK_ADMIN_PASSWORD}" ]] \
            || { echo "::error::keycloak-admin-password output is empty"; exit 1; }
          [[ -n "${ARGOCD_ADMIN_PASSWORD}" ]] \
            || { echo "::error::argocd-admin-password output is empty"; exit 1; }
          echo "OK: gateway-ip=${GATEWAY_IP}; keycloak/argocd admin passwords populated"

      - name: Debug cluster state
        if: failure()
        env:
          KUBECONFIG: ${{ steps.sandbox.outputs.kubeconfig }}
        run: |
          echo "=== Pods ==="; kubectl get pods -A || true
          echo ""; echo "=== ArgoCD Applications ==="
          kubectl get applications -n argocd -o wide || true
          echo ""; echo "=== Recent warning events ==="
          kubectl get events -A --field-selector type=Warning --sort-by='.lastTimestamp' 2>/dev/null | tail -30 || true
