name: Test Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'action.yml'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/test-action.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-cluster-only:
    name: "Test cluster-only profile"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Nebari Sandbox
        id: sandbox
        uses: ./
        with:
          profile: cluster-only
          cluster-name: test-cluster

      - name: Verify cluster is functional
        run: |
          echo "Kubeconfig: ${{ steps.sandbox.outputs.kubeconfig }}"
          echo "Cluster: ${{ steps.sandbox.outputs.cluster-name }}"

          # Verify we can talk to the cluster
          kubectl get namespaces

          # Verify core components are running
          kubectl get pods -n kube-system

          # Deploy a simple workload to confirm scheduling works
          kubectl create deployment nginx --image=nginx:alpine --replicas=1
          kubectl wait --for=condition=Available deployment/nginx --timeout=60s
          kubectl delete deployment nginx

      - name: Cleanup
        if: always()
        run: k3d cluster delete ${{ steps.sandbox.outputs.cluster-name }}

  test-platform:
    name: "Test platform profile (pre-built NIC binary)"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Nebari Sandbox
        id: sandbox
        uses: ./
        with:
          profile: platform
          cluster-name: nebari-platform-test
          resource-summary: "true"

      - name: Run scenarios
        run: bash tests/run-scenarios.sh
        env:
          KUBECONFIG: ${{ steps.sandbox.outputs.kubeconfig }}

      - name: Verify keycloak-issuer-url output (#25)
        # Default action config sets `domain: nebari.local`, so the derived
        # issuer URL must be `https://keycloak.nebari.local`. Asserting the
        # exact value catches accidental changes to NIC's URL formula (or to
        # the action's default domain).
        run: |
          set -euo pipefail
          EXPECTED="https://keycloak.nebari.local"
          ACTUAL="${{ steps.sandbox.outputs.keycloak-issuer-url }}"
          if [[ "${ACTUAL}" != "${EXPECTED}" ]]; then
            echo "::error::keycloak-issuer-url mismatch: got '${ACTUAL}', expected '${EXPECTED}'"
            exit 1
          fi
          echo "OK: keycloak-issuer-url = ${ACTUAL}"

      - name: Verify keycloak-realm-admin-password reachability (#25)
        # The output itself is best-effort (timing-dependent on the async
        # realm-setup PostSync hook), so we don't strictly assert the action
        # captured it. What we DO assert is that the underlying secret
        # eventually materializes — which is what consumers care about.
        # Waits up to 10 min for `job/keycloak-realm-setup` to complete and
        # then reads the secret. Same shape as the workaround nebari-landing
        # is running today.
        env:
          KUBECONFIG: ${{ steps.sandbox.outputs.kubeconfig }}
          OUTPUT_VALUE: ${{ steps.sandbox.outputs.keycloak-realm-admin-password }}
        run: |
          set -euo pipefail
          echo "Output captured by action: $([[ -n "${OUTPUT_VALUE}" ]] && echo "populated (extract-outputs caught it within 30s polling)" || echo "empty (realm-setup ran longer than 30s; consumer falls back to kubectl get secret)")"
          echo "Waiting for job/keycloak-realm-setup to complete..."
          kubectl wait --for=condition=complete job/keycloak-realm-setup \
            -n keycloak --timeout=600s
          SECRET=$(kubectl -n keycloak get secret nebari-realm-admin-credentials \
            -o jsonpath='{.data.password}' | base64 -d)
          if [[ -z "${SECRET}" ]]; then
            echo "::error::nebari-realm-admin-credentials secret is empty after realm-setup completed"
            exit 1
          fi
          echo "OK: nebari-realm-admin-credentials secret is populated"

      - name: Debug cluster state
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods -A || true

          echo ""
          echo "=== ArgoCD Applications ==="
          kubectl get applications -n argocd -o wide || true

          echo ""
          echo "=== Recent warning events ==="
          kubectl get events -A --field-selector type=Warning --sort-by='.lastTimestamp' 2>/dev/null | tail -30 || true

      - name: Cleanup
        if: always()
        run: |
          k3d cluster delete ${{ steps.sandbox.outputs.cluster-name }}
          if [[ -n "${{ steps.sandbox.outputs.network-name }}" ]]; then
            docker network rm ${{ steps.sandbox.outputs.network-name }} 2>/dev/null || true
          fi

