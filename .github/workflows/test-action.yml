name: Test Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-cluster-only:
    name: "Test cluster-only profile"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Nebari Sandbox
        id: sandbox
        uses: ./
        with:
          profile: cluster-only
          cluster-name: test-cluster

      - name: Verify cluster is functional
        run: |
          echo "Kubeconfig: ${{ steps.sandbox.outputs.kubeconfig }}"
          echo "Cluster: ${{ steps.sandbox.outputs.cluster-name }}"

          # Verify we can talk to the cluster
          kubectl get namespaces

          # Verify core components are running
          kubectl get pods -n kube-system

          # Deploy a simple workload to confirm scheduling works
          kubectl create deployment nginx --image=nginx:alpine --replicas=1
          kubectl wait --for=condition=Available deployment/nginx --timeout=60s
          kubectl delete deployment nginx

      - name: Cleanup
        if: always()
        run: k3d cluster delete test-cluster

  test-platform:
    name: "Test platform profile"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Cache NIC Go modules and build
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: nic-go-${{ runner.os }}-${{ hashFiles('.github/workflows/test-action.yml') }}
          restore-keys: |
            nic-go-${{ runner.os }}-

      - name: Setup Nebari Sandbox
        id: sandbox
        uses: ./
        with:
          profile: platform
          cluster-name: nebari-platform-test

      - name: Await workloads
        uses: jupyterhub/action-k8s-await-workloads@v3
        with:
          namespace: ""
          timeout: 300
          max-restarts: 3

      - name: Debug cluster state
        if: always()
        run: |
          echo "=== ArgoCD Applications ==="
          kubectl get applications -n argocd -o wide || true

          echo ""
          echo "=== All pods across all namespaces ==="
          kubectl get pods -A || true

          echo ""
          echo "=== Services with type LoadBalancer ==="
          kubectl get svc -A --field-selector spec.type=LoadBalancer || true

          echo ""
          echo "=== Events (warnings only) ==="
          kubectl get events -A --field-selector type=Warning --sort-by='.lastTimestamp' 2>/dev/null | tail -30 || true

      - name: Cleanup
        if: always()
        run: |
          k3d cluster delete nebari-platform-test
          docker network rm nebari-nebari-platform-test-net 2>/dev/null || true
