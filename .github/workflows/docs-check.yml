name: Docs sync check

on:
  pull_request:
    paths:
      - action.yml
      - README.md
      - .github/workflows/docs-check.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: README in sync with action.yml
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Regenerate README from action.yml
        run: npx --yes action-docs@2.4.0 --no-banner --update-readme README.md

      - name: Verify no drift
        run: |
          if ! git diff --exit-code README.md; then
            echo "::error::README.md is out of sync with action.yml."
            echo "Run locally and commit:"
            echo "  npx --yes action-docs@2.4.0 --no-banner --update-readme README.md"
            exit 1
          fi

      - name: Verify version badges match action.yml defaults
        # The kubernetes/k3d shields.io badges in the README header are
        # hand-written and silently drift from the k8s-version / k3d-version
        # input defaults. action-docs only regenerates the Inputs/Outputs
        # tables, not the badges, so guard them here: the k3d badge must equal
        # the full k3d-version default, and the kubernetes badge must equal the
        # major.minor of the k8s-version default (the badge intentionally omits
        # the patch). Fails the PR on drift so the badges can't go stale. See
        # #59 for the alternatives considered (this is the cheapest: no gist,
        # no PAT, reuses this workflow).
        run: |
          set -euo pipefail

          k8s_default=$(awk '/^  k8s-version:/{f=1} f&&$1=="default:"{gsub(/"/,"",$2); print $2; exit}' action.yml)
          k3d_default=$(awk '/^  k3d-version:/{f=1} f&&$1=="default:"{gsub(/"/,"",$2); print $2; exit}' action.yml)
          if [[ -z "${k8s_default}" || -z "${k3d_default}" ]]; then
            echo "::error::Could not read k8s-version/k3d-version defaults from action.yml"
            exit 1
          fi
          k8s_minor="${k8s_default%.*}"   # 1.32.4 -> 1.32

          k8s_badge=$(grep -oE 'badge/kubernetes-v[0-9]+\.[0-9]+' README.md | head -1 | sed 's#.*kubernetes-v##')
          k3d_badge=$(grep -oE 'badge/k3d-v[0-9]+\.[0-9]+\.[0-9]+' README.md | head -1 | sed 's#.*k3d-v##')

          fail=0
          if [[ "${k8s_badge}" != "${k8s_minor}" ]]; then
            echo "::error::kubernetes badge shows v${k8s_badge:-<none>} but action.yml k8s-version default is ${k8s_default} (expected badge v${k8s_minor})"
            fail=1
          fi
          if [[ "${k3d_badge}" != "${k3d_default}" ]]; then
            echo "::error::k3d badge shows v${k3d_badge:-<none>} but action.yml k3d-version default is ${k3d_default} (expected badge v${k3d_default})"
            fail=1
          fi
          if [[ "${fail}" -ne 0 ]]; then
            echo "Update the badge URLs in the README header to match action.yml, then re-push."
            exit 1
          fi
          echo "OK: version badges match action.yml defaults (kubernetes v${k8s_minor}, k3d v${k3d_default})."
