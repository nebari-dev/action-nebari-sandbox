name: "Await Kubernetes Workloads"
description: "Wait for Deployments, DaemonSets, and StatefulSets in a namespace to roll out, with optional restart-count guard."

inputs:
  namespace:
    description: "Namespace to watch"
    required: true
  timeout:
    description: "Seconds before giving up on each rollout"
    required: false
    default: "300"
  max-restarts:
    description: "Fail if any container in the namespace exceeds this restart count. -1 disables the check."
    required: false
    default: "0"

runs:
  using: "composite"
  steps:
    - name: Wait for rollouts
      shell: bash
      run: ${{ github.action_path }}/wait.sh
      env:
        NAMESPACE: ${{ inputs.namespace }}
        TIMEOUT: ${{ inputs.timeout }}
        MAX_RESTARTS: ${{ inputs.max-restarts }}
