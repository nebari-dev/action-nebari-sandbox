name: "Setup Nebari Sandbox"
description: "Deploy a local Nebari platform (kind, via NIC's local provider) for component testing, and tear it down when the job ends."
branding:
  icon: box
  color: purple

inputs:
  cluster-name:
    description: >
      Name for the deployment. Used as NIC's `project_name` and as the kind
      cluster name (context `kind-<cluster-name>`). Must be unique on the runner.
    required: false
    default: "nebari-test"
  resource-summary:
    description: >
      When 'true', append a markdown table of pod resource requests/limits and
      node allocatable capacity to $GITHUB_STEP_SUMMARY after the platform stack
      is up. Useful for tracking minimum-spec requirements as the foundational
      stack evolves.
    required: false
    default: "false"
  timing-report:
    description: >
      When 'true', record wall-clock durations for key phases (nic deploy, etc.)
      and append a markdown timing table to $GITHUB_STEP_SUMMARY. Intended for
      benchmarking and profiling CI runs; no effect when 'false'.
    required: false
    default: "false"
  nic-version:
    description: >
      NIC version to install. Requires NIC v0.13.0 or newer: this action uses
      NIC's `local` (kind) cluster provider and `local` repository provider,
      which the v0.13.0 repository-provider split introduced.
      - 'latest' (default): downloads the latest released pre-built binary.
      - 'vX.Y.Z': downloads that release's pre-built binary (>= v0.13.0).
      - '.': builds from $GITHUB_WORKSPACE (use when the consumer has the
        NIC repo checked out, e.g. NIC's own self-tests).
      - Any other string (branch name, tag, commit sha): clones that ref
        and builds from source. Requires Go in the consumer's workflow
        (add actions/setup-go before this action).
      Ignored when `nic-binary` is set. Leave at the default if you use
      `nic-binary`; setting both to meaningful values is an error.
    required: false
    default: "latest"
  nic-binary:
    description: >
      Path to a pre-built `nic` binary on the runner. When set, the action
      installs it directly and ignores `nic-version` - use this to build `nic`
      once in an earlier job and reuse it across matrix jobs instead of
      rebuilding from source each time. Mutually exclusive with a non-default
      `nic-version`.
    required: false
    default: ""
  nic-config:
    description: >
      Path to a consumer-supplied NIC config file. When set, the action skips
      its built-in config template and passes this file to `nic deploy -f`
      directly. For the action's outputs to resolve, the config's `project_name`
      must equal `cluster-name`, and it must use the `local` cluster provider
      (`cluster.local`) and the `local` repository provider (`repository.local`).
    required: false
    default: ""
  in-cluster-dns:
    description: >
      When 'true' (default), add a CoreDNS entry so the external Nebari
      hostnames (`*.<domain>`, e.g. `keycloak.nebari.local`) resolve to the
      gateway from INSIDE the cluster. Required for consumer pods doing
      server-side OIDC (see #69). Set 'false' if you manage in-cluster DNS
      yourself.
    required: false
    default: "true"
  destroy:
    description: >
      When 'true' (default), destroy the deployment (`nic destroy`) in the
      action's post step when the job ends, including on failure or
      cancellation. Set 'false' to leave the cluster running (e.g. to inspect
      it in a later step).
    required: false
    default: "true"
  token:
    description: >
      GitHub token used by the NIC installer for authenticated release/API
      calls (avoids the low unauthenticated rate limit).
    required: false
    default: ${{ github.token }}

outputs:
  kubeconfig:
    description: "Path to the kubeconfig file for the created kind cluster (also exported as KUBECONFIG)."
  cluster-name:
    description: "Name of the deployment (NIC project_name; kind context is `kind-<cluster-name>`)."
  gitops-dir:
    description: "Local GitOps directory NIC created and mounted into the cluster (~/.nic/gitops/<cluster-name>)."
  keycloak-admin-password:
    description: "Keycloak admin password for the *master* realm. Use `keycloak-realm-admin-password` for the nebari realm."
  keycloak-realm-admin-password:
    description: >
      Keycloak admin password for the *nebari* realm. Provisioned asynchronously
      by NIC's realm-setup PostSync hook, so this may be empty if the secret has
      not materialized by the time extract-outputs.sh polls (see #27). When
      empty, read the `nebari-realm-admin-credentials` secret in the `keycloak`
      namespace after your own wait-for-realm step.
  argocd-admin-password:
    description: "ArgoCD admin password."
  gateway-ip:
    description: "Gateway LoadBalancer IP, assigned by MetalLB from the kind Docker network pool (routable from the Linux runner)."
  keycloak-issuer-url:
    description: >
      External public issuer URL for the Keycloak deployment, e.g.
      `https://keycloak.nebari.local`. Derived from the `domain` field in the
      NIC config, matching NIC's own formula. Useful for JWT `iss` claim
      validation in consumer e2e tests.
  domain:
    description: "The Nebari domain the platform was deployed with, e.g. `nebari.local`."
  ca-cert-path:
    description: >
      Path on the runner to the sandbox gateway's CA certificate, extracted from
      the `nebari-gateway-tls` secret. Use it for runner-side `curl --cacert`, or
      to build a ConfigMap/Secret your pods mount so they trust `https://<domain>`.
      The same CA is published in-cluster as ConfigMap `nebari-sandbox-ca` (key
      `ca.crt`) in `kube-public`. Empty if the gateway TLS secret could not be
      read (see #69).

runs:
  using: "node24"
  main: "dist/index.js"
  post: "dist/post.js"
