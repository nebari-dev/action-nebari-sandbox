name: "Setup Nebari Sandbox"
description: "Reusable GitHub Action to bootstrap a local Kubernetes test environment for Nebari component testing"

inputs:
  profile:
    description: >
      Deployment profile.
      - cluster-only: k3d cluster + kubeconfig, no NIC.
      - platform: full foundational stack via NIC/ArgoCD.
      See the Profiles table in the README for current median wall-clock
      durations (auto-refreshed via the benchmark-timings workflow).
    required: false
    default: "cluster-only"
  cluster-name:
    description: "Name for the k3d cluster (must be unique on the runner)"
    required: false
    default: "nebari-test"
  k8s-version:
    description: "Kubernetes version to use (maps to a k3d image tag)"
    required: false
    default: "1.32.4"
  k3d-version:
    description: "k3d version to install"
    required: false
    default: "5.8.3"
  resource-summary:
    description: >
      When 'true' (and profile is 'platform'), append a markdown table of
      pod resource requests/limits and node allocatable capacity to
      $GITHUB_STEP_SUMMARY after the platform stack is up. Useful for
      tracking minimum-spec requirements as the foundational stack evolves.
    required: false
    default: "false"
  timing-report:
    description: >
      When 'true', record wall-clock durations for key phases (k3s image pull,
      k3d cluster create, nic deploy, etc.) and append a markdown timing table
      to $GITHUB_STEP_SUMMARY. Works with both profiles. Intended for benchmarking
      and profiling CI runs; has no effect on normal operation when 'false'.
    required: false
    default: "false"
  nic-version:
    description: >
      NIC version to install (platform profile only).
      - 'latest' (default): downloads the latest released pre-built binary.
      - 'vX.Y.Z': downloads a specific release's pre-built binary.
      - '.': builds from $GITHUB_WORKSPACE (use when the consumer has the
        NIC repo checked out, e.g. NIC's own self-tests).
      - Any other string (branch name, tag, commit sha): clones that ref
        and builds from source. Requires Go in the consumer's workflow
        (add actions/setup-go before this action).
    required: false
    default: "latest"
  nic-config:
    description: >
      Path to a consumer-supplied NIC config file (platform profile only).
      When set, the action skips its built-in config template and passes
      this file to `nic deploy -f` directly. The consumer is responsible
      for matching the rest of the action's setup — two fields in
      particular must point at what the action actually provisioned:

        - `cluster.existing.context` — derived as `k3d-<cluster-name>`
          (e.g. `k3d-nebari-test` for the default cluster-name). The action
          provisions the k3d cluster itself, so NIC connects to it via the
          `existing` provider rather than provisioning one.
        - `git_repository.url` — derived as
          `file:///tmp/nebari-gitops-<cluster-name>` (a hostPath mount
          into the k3d node so ArgoCD's repo-server can read it).

      The action does not validate these; NIC's config parser will surface
      real mismatches at deploy time. When unset (default), the action
      generates its standard config as before.
    required: false
    default: ""

outputs:
  kubeconfig:
    description: "Path to the kubeconfig file for the created cluster"
    value: ${{ steps.create-cluster.outputs.kubeconfig }}
  cluster-name:
    description: "Name of the created k3d cluster"
    value: ${{ steps.create-cluster.outputs.cluster-name }}
  gitops-dir:
    description: "Local GitOps directory mounted into the cluster (platform profile only)"
    value: ${{ steps.create-cluster.outputs.gitops-dir }}
  keycloak-admin-password:
    description: "Keycloak admin password for the *master* realm (platform profile only). Use `keycloak-realm-admin-password` for the nebari realm."
    value: ${{ steps.extract-outputs.outputs.keycloak-admin-password }}
  keycloak-realm-admin-password:
    description: >
      Keycloak admin password for the *nebari* realm (platform profile only).
      Provisioned asynchronously by NIC's realm-setup PostSync hook after
      Keycloak becomes Ready, so this output may be empty if the secret has
      not materialized by the time `extract-outputs.sh` polls (see #27 for the
      planned wait-for-realm input). When empty, consumers can fall back to
      reading the `nebari-realm-admin-credentials` secret in the `keycloak`
      namespace after their own wait-for-realm step.
    value: ${{ steps.extract-outputs.outputs.keycloak-realm-admin-password }}
  argocd-admin-password:
    description: "ArgoCD admin password (platform profile only)"
    value: ${{ steps.extract-outputs.outputs.argocd-admin-password }}
  gateway-ip:
    description: "Gateway LoadBalancer IP (platform profile only), assigned by k3d's servicelb (klipper)."
    value: ${{ steps.extract-outputs.outputs.gateway-ip }}
  keycloak-issuer-url:
    description: >
      External public issuer URL for the Keycloak deployment (platform profile
      only), e.g. `https://keycloak.nebari.local`. Derived from the `domain`
      field in the NIC config NIC wrote to the gitops repo, matching NIC's own
      formula. Useful for JWT `iss` claim validation in consumer e2e tests.
    value: ${{ steps.extract-outputs.outputs.keycloak-issuer-url }}

runs:
  using: "composite"
  steps:
    - name: Install k3d
      shell: bash
      run: ${{ github.action_path }}/scripts/install-k3d.sh
      env:
        K3D_VERSION: ${{ inputs.k3d-version }}

    - name: Create k3d cluster
      id: create-cluster
      shell: bash
      run: ${{ github.action_path }}/scripts/create-cluster.sh
      env:
        CLUSTER_NAME: ${{ inputs.cluster-name }}
        K8S_VERSION: ${{ inputs.k8s-version }}
        PROFILE: ${{ inputs.profile }}

    - name: Install NIC
      if: inputs.profile == 'platform'
      shell: bash
      run: ${{ github.action_path }}/scripts/install-nic.sh
      env:
        NIC_VERSION: ${{ inputs.nic-version }}
        # Used by install-nic.sh for authenticated GitHub API calls (release
        # metadata + checksums.txt). Avoids the 60/hr unauthenticated rate
        # limit, which can bite on self-hosted runners sharing an egress IP.
        GITHUB_TOKEN: ${{ github.token }}

    - name: Deploy platform
      if: inputs.profile == 'platform'
      shell: bash
      run: ${{ github.action_path }}/scripts/deploy-platform.sh
      env:
        CLUSTER_NAME: ${{ inputs.cluster-name }}
        GITOPS_DIR: ${{ steps.create-cluster.outputs.gitops-dir }}
        NEBARI_TIMING_REPORT: ${{ inputs.timing-report }}
        NIC_CONFIG: ${{ inputs.nic-config }}

    - name: Extract platform outputs
      if: inputs.profile == 'platform'
      id: extract-outputs
      shell: bash
      run: ${{ github.action_path }}/scripts/extract-outputs.sh
      env:
        GITOPS_DIR: ${{ steps.create-cluster.outputs.gitops-dir }}

    - name: Await platform workloads
      if: inputs.profile == 'platform'
      shell: bash
      run: ${{ github.action_path }}/scripts/wait-platform.sh
      env:
        AWAIT_TIMEOUT: "300"

    - name: Collect deploy-phase timings
      if: inputs.profile == 'platform' && inputs.timing-report == 'true'
      shell: bash
      run: python3 ${{ github.action_path }}/scripts/collect-deploy-timings.py
      env:
        CLUSTER_NAME: ${{ inputs.cluster-name }}

    - name: Generate resource summary
      if: inputs.profile == 'platform' && inputs.resource-summary == 'true'
      shell: bash
      run: python3 ${{ github.action_path }}/scripts/resource-summary.py

    - name: Generate timing report
      if: inputs.timing-report == 'true'
      shell: bash
      run: python3 ${{ github.action_path }}/scripts/timing-report.py
      env:
        CLUSTER_NAME: ${{ inputs.cluster-name }}
