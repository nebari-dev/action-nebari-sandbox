name: "Setup Nebari Sandbox"
description: "Reusable GitHub Action to bootstrap a local Nebari platform (kind, via NIC's local provider) for component testing"

inputs:
  cluster-name:
    description: >
      Name for the deployment. Used as NIC's `project_name` and as the kind
      cluster name (context `kind-<cluster-name>`). Must be unique on the runner.
    required: false
    default: "nebari-test"
  resource-summary:
    description: >
      When 'true', append a markdown table of pod resource requests/limits and
      node allocatable capacity to $GITHUB_STEP_SUMMARY after the platform stack
      is up. Useful for tracking minimum-spec requirements as the foundational
      stack evolves.
    required: false
    default: "false"
  timing-report:
    description: >
      When 'true', record wall-clock durations for key phases (nic deploy, etc.)
      and append a markdown timing table to $GITHUB_STEP_SUMMARY. Intended for
      benchmarking and profiling CI runs; no effect when 'false'.
    required: false
    default: "false"
  nic-version:
    description: >
      NIC version to install. Requires NIC v0.13.0 or newer: this action uses
      NIC's `local` (kind) cluster provider and `local` repository provider,
      which the v0.13.0 repository-provider split introduced.
      - 'latest' (default): downloads the latest released pre-built binary.
      - 'vX.Y.Z': downloads that release's pre-built binary (>= v0.13.0).
      - '.': builds from $GITHUB_WORKSPACE (use when the consumer has the
        NIC repo checked out, e.g. NIC's own self-tests).
      - Any other string (branch name, tag, commit sha): clones that ref
        and builds from source. Requires Go in the consumer's workflow
        (add actions/setup-go before this action).
      Ignored when `nic-binary` is set. Leave at the default if you use
      `nic-binary`; setting both to meaningful values is an error.
    required: false
    default: "latest"
  nic-binary:
    description: >
      Path to a pre-built `nic` binary on the runner. When set, the action
      installs it directly and ignores `nic-version` — use this to build `nic`
      once in an earlier job (e.g. upload/download it as an artifact) and reuse
      it across per-provider or matrix jobs instead of rebuilding from source
      each time. Mutually exclusive with a non-default `nic-version`.
    required: false
    default: ""
  nic-config:
    description: >
      Path to a consumer-supplied NIC config file. When set, the action skips
      its built-in config template and passes this file to `nic deploy -f`
      directly. For the action's outputs to resolve, the config's `project_name`
      must equal `cluster-name`, and it must use the `local` cluster provider
      (`cluster.local`) and the `local` repository provider (`repository.local`),
      which is what the action provisions. The action does not validate this;
      NIC's config parser surfaces real mismatches at deploy time.
    required: false
    default: ""
  in-cluster-dns:
    description: >
      When 'true' (default), add a CoreDNS entry so the external Nebari
      hostnames (`*.<domain>`, e.g. `keycloak.nebari.local`) resolve to the
      gateway from INSIDE the cluster. Required for consumer pods doing
      server-side OIDC: Keycloak's discovery document advertises the external
      issuer, so a pod must reach that same hostname (see #69). Only
      `keycloak.<domain>`, `argocd.<domain>`, and `<domain>` have valid TLS SANs.
      Set 'false' if you manage in-cluster DNS yourself.
    required: false
    default: "true"

outputs:
  kubeconfig:
    description: "Path to the kubeconfig file for the created kind cluster."
    value: ${{ steps.deploy.outputs.kubeconfig }}
  cluster-name:
    description: "Name of the deployment (NIC project_name; kind context is `kind-<cluster-name>`)."
    value: ${{ steps.deploy.outputs.cluster-name }}
  gitops-dir:
    description: "Local GitOps directory NIC created and mounted into the cluster (~/.nic/gitops/<cluster-name>)."
    value: ${{ steps.deploy.outputs.gitops-dir }}
  keycloak-admin-password:
    description: "Keycloak admin password for the *master* realm. Use `keycloak-realm-admin-password` for the nebari realm."
    value: ${{ steps.extract-outputs.outputs.keycloak-admin-password }}
  keycloak-realm-admin-password:
    description: >
      Keycloak admin password for the *nebari* realm. Provisioned asynchronously
      by NIC's realm-setup PostSync hook after Keycloak becomes Ready, so this
      may be empty if the secret has not materialized by the time
      extract-outputs.sh polls (see #27). When empty, read the
      `nebari-realm-admin-credentials` secret in the `keycloak` namespace after
      your own wait-for-realm step.
    value: ${{ steps.extract-outputs.outputs.keycloak-realm-admin-password }}
  argocd-admin-password:
    description: "ArgoCD admin password."
    value: ${{ steps.extract-outputs.outputs.argocd-admin-password }}
  gateway-ip:
    description: "Gateway LoadBalancer IP, assigned by MetalLB from the kind Docker network pool (routable from the Linux runner)."
    value: ${{ steps.extract-outputs.outputs.gateway-ip }}
  keycloak-issuer-url:
    description: >
      External public issuer URL for the Keycloak deployment, e.g.
      `https://keycloak.nebari.local`. Derived from the `domain` field in the
      NIC config, matching NIC's own formula. Useful for JWT `iss` claim
      validation in consumer e2e tests.
    value: ${{ steps.extract-outputs.outputs.keycloak-issuer-url }}
  domain:
    description: >
      The Nebari domain the platform was deployed with, e.g. `nebari.local`.
      Read from the NIC config in the gitops repo.
    value: ${{ steps.extract-outputs.outputs.domain }}
  ca-cert-path:
    description: >
      Path on the runner to the sandbox gateway's CA certificate, extracted from
      the `nebari-gateway-tls` secret. Use it for runner-side `curl --cacert`, or
      to build a ConfigMap/Secret your pods mount so they trust `https://<domain>`
      (the gateway serves a selfsigned cert). The same CA is published in-cluster
      as ConfigMap `nebari-sandbox-ca` (key `ca.crt`) in `kube-public`. Empty if
      the gateway TLS secret could not be read (see #69).
    value: ${{ steps.publish-ca.outputs.ca-cert-path }}

runs:
  using: "composite"
  steps:
    - name: Install NIC
      shell: bash
      run: ${{ github.action_path }}/scripts/install-nic.sh
      env:
        NIC_VERSION: ${{ inputs.nic-version }}
        NIC_BINARY: ${{ inputs.nic-binary }}
        GITHUB_TOKEN: ${{ github.token }}

    - name: Deploy platform
      id: deploy
      shell: bash
      run: ${{ github.action_path }}/scripts/deploy-platform.sh
      env:
        CLUSTER_NAME: ${{ inputs.cluster-name }}
        NEBARI_TIMING_REPORT: ${{ inputs.timing-report }}
        NIC_CONFIG: ${{ inputs.nic-config }}

    - name: Extract platform outputs
      id: extract-outputs
      shell: bash
      run: ${{ github.action_path }}/scripts/extract-outputs.sh
      env:
        GITOPS_DIR: ${{ steps.deploy.outputs.gitops-dir }}

    - name: Set up in-cluster DNS
      if: inputs.in-cluster-dns == 'true'
      shell: bash
      run: ${{ github.action_path }}/scripts/setup-in-cluster-dns.sh
      env:
        DOMAIN: ${{ steps.extract-outputs.outputs.domain }}
        GATEWAY_IP: ${{ steps.extract-outputs.outputs.gateway-ip }}

    - name: Await platform workloads
      shell: bash
      run: ${{ github.action_path }}/scripts/wait-platform.sh
      env:
        AWAIT_TIMEOUT: "300"

    - name: Publish sandbox CA
      id: publish-ca
      shell: bash
      run: ${{ github.action_path }}/scripts/publish-ca.sh
      env:
        CLUSTER_NAME: ${{ inputs.cluster-name }}

    - name: Collect deploy-phase timings
      if: inputs.timing-report == 'true'
      shell: bash
      run: python3 ${{ github.action_path }}/scripts/collect-deploy-timings.py
      env:
        CLUSTER_NAME: ${{ inputs.cluster-name }}

    - name: Generate resource summary
      if: inputs.resource-summary == 'true'
      shell: bash
      run: python3 ${{ github.action_path }}/scripts/resource-summary.py

    - name: Generate timing report
      if: inputs.timing-report == 'true'
      shell: bash
      run: python3 ${{ github.action_path }}/scripts/timing-report.py
      env:
        CLUSTER_NAME: ${{ inputs.cluster-name }}
